<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kacSearch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      color: black;
      padding: 50px;
      margin: 0;
      transition: background 0.5s, color 0.5s;
    }
    .search-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: inline-block;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #00c853;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background-color: #00a743;
    }
    #copilotBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #00c853;
      border-radius: 8px;
      padding: 12px 20px;
      z-index: 999;
      transition: transform 0.2s ease;
    }
    #copilotBtn:active {
      animation: bounce 0.4s;
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.15); }
      60% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .steve {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      animation: mine 1s infinite;
    }
    @keyframes mine {
      0%   { transform: translateX(-50%) rotate(0); }
      50%  { transform: translateX(-50%) rotate(-10deg); }
      100% { transform: translateX(-50%) rotate(0); }
    }
    body.dark-mode {
      background: #121212;
      color: white;
    }
    body.dark-mode input {
      background: #1e1e1e;
      color: white;
      border: 1px solid #444;
    }
    body.dark-mode button {
      background-color: #2e7d32;
    }
    body.dark-mode button:hover {
      background-color: #1b5e20;
    }
    body.rgb-mode {
      animation: rainbowBg 10s infinite alternate;
    }
    @keyframes rainbowBg {
      0% { background-color: red; }
      25% { background-color: orange; }
      50% { background-color: yellow; }
      75% { background-color: green; }
      100% { background-color: blue; }
    }
    #settingsBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #00c853;
      padding: 10px 15px;
      border-radius: 6px;
      z-index: 1000;
    }
    #settingsMenu {
      position: fixed;
      right: -260px;
      top: 0;
      width: 250px;
      height: 100%;
      background: #222;
      color: white;
      padding: 20px;
      transition: right 0.3s ease;
      z-index: 999;
    }
    #settingsMenu.active {
      right: 0;
    }
    .theme-btn {
      display: block;
      background: #00c853;
      color: white;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <h2>Welcome to kacSearch</h2>
    <form onsubmit="event.preventDefault(); performSearch();">
      <input type="text" id="searchBox" placeholder="Type something... ($sudo apt install minecraft)" required>
      <br>
      <button type="submit">Search</button>
    </form>
  </div>

  <button id="copilotBtn" onclick="openCopilot()">Talk to AI</button>
  <button id="settingsBtn" onclick="toggleSettings()">⚙️ Settings</button>

  <div id="settingsMenu">
    <h3>Theme Settings</h3>
    <button class="theme-btn" onclick="setTheme('light')">Light</button>
    <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
    <button class="theme-btn" onclick="setTheme('rgb')">RGB</button>
    <button class="theme-btn" onclick="setTheme('old')">Old</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.performSearch = function () {
        const q = document.getElementById("searchBox").value.trim();
        if (!q) return;

        if (q.toLowerCase() === "$sudo apt install minecraft") {
          startMiningEffect();
        } else {
          const searchUrl = "https://www.bing.com/search?q=" + encodeURIComponent(q);
          window.open(searchUrl, "_blank", "noopener,noreferrer");
        }
      };

      window.openCopilot = function () {
        window.open("https://copilot.microsoft.com", "_blank", "noopener,noreferrer");
      };

      window.toggleSettings = function () {
        document.getElementById("settingsMenu").classList.toggle("active");
      };

      window.setTheme = function (mode) {
        const body = document.body;
        body.classList.remove("light-mode", "dark-mode", "rgb-mode", "old-mode");

        if (mode === "dark") {
          body.classList.add("dark-mode");
        } else if (mode === "rgb") {
          body.classList.add("rgb-mode");
        } else if (mode === "old") {
          body.style.backgroundColor = "#f4f4f4";
          body.style.color = "black";
        } else {
          body.style.backgroundColor = "white";
          body.style.color = "black";
        }
      };

      window.startMiningEffect = function () {
        const steve = document.createElement("img");
        steve.src = "https://upload.wikimedia.org/wikipedia/en/5/56/Steve_%28Minecraft%29.png";
        steve.classList.add("steve");
        document.body.appendChild(steve);

        const elements = document.querySelectorAll("body *:not(script, img)");
        elements.forEach((el, i) => {
          setTimeout(() => {
            el.style.opacity = "0";
            el.style.transform = "scale(0.9)";
          }, i * 100);
        });

        setTimeout(() => {
          window.open("https://www.minecraft.net/en-us/download", "_blank");
        }, elements.length * 100 + 2000);
      };
    });
  </script>
</body>
</html>
